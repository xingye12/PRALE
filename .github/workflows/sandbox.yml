name: Linux workspace sandbox
on: [push, pull_request]
jobs:
  bubblewrap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: pip install -e '.[dev]'
      - run: PRALE_REQUIRE_BWRAP=1 pytest tests/unit/test_shell_sandbox.py tests/integration/test_bash_sandbox.py
