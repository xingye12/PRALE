[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prale-agent-harness"
version = "0.1.0"
description = "Durable Python runtime for pi-style agents"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
