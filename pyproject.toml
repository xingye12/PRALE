[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prale-agent-harness"
version = "0.1.0"
description = "Durable Python runtime for pi-style agents"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/agent_harness/domain", "src/agent_harness/storage", "src/agent_harness/api"]
follow_imports = "skip"
check_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
