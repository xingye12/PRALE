<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRALE Agent Console</title>
    <!-- No build step (ADR-WEB-005): the server ships these modules as-is. -->
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">PRALE<span class="brand-sub">Agent Console</span></div>
      <dl class="project" id="project" aria-label="项目"></dl>
      <div class="controls">
        <label class="field">
          <span>session</span>
          <select id="session-select"></select>
        </label>
        <button id="new-session" class="ghost" type="button">新建 session</button>
        <label class="field">
          <span>lane</span>
          <select id="lane-select"></select>
        </label>
        <button id="credential" class="ghost" type="button">凭据</button>
        <span id="stream-state" class="stream-state" data-state="idle">事件流：未连接</span>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="nav">
        <a href="#/chat" data-view="chat">对话</a>
        <a href="#/trace" data-view="trace">轨迹</a>
        <a href="#/memory" data-view="memory">记忆</a>
        <a href="#/skills" data-view="skills">技能</a>
        <p class="sidebar-note">
          历史一律来自 durable 记录；事件流只用于触发重新读取。
        </p>
      </nav>
      <main class="view" id="view"></main>
    </div>

    <div class="toast" id="toast" hidden></div>

    <dialog id="credential-dialog">
      <form method="dialog">
        <h2>服务凭据</h2>
        <p class="hint">
          该部署配置了服务 token：请求需要 <code>Authorization: Bearer</code>。凭据只保存在本页面的
          sessionStorage，不会写入 URL。
        </p>
        <input id="credential-input" type="password" autocomplete="off" placeholder="token" />
        <menu>
          <button value="save" id="credential-save" type="submit">保存</button>
          <button value="clear" type="submit">清除</button>
          <button value="cancel" type="submit" formnovalidate>取消</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
